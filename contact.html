<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="profile-section">
            <img src="Syafiqah.jpg" alt="Profile Picture" class="profile-img">
            <h2>Nursyafiqah Binti Abu Hassan</h2>
            <div class="social-icons">
                <a href="#" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="#" target="_blank"><i class="fab fa-facebook-f"></i></a>
                <a href="mailto:email@example.com"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
            <a href="about.html" class="nav-item"><i class="fas fa-user"></i> About Me</a>
            <a href="resume.html" class="nav-item"><i class="fas fa-file-alt"></i> Resume</a>

    <!-- MAIN CONTENT -->
    <main class="main-content content-page">
        <div class="container">
            <h2 class="page-title">Contact Me</h2>
            <form class="contact-form" onsubmit="alert('Message sent successfully!'); return false;">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" required placeholder="Write your message here..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </div>
    </main>

</body>
